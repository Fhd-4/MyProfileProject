<div class="login-wrapper" dir="ltr">
  <!-- Interactive Constellation Network Canvas -->
  <canvas #particleCanvas class="interactive-canvas"></canvas>

  <!-- Top Bar: Back to Card on Left, Language button on Right -->
  <header class="top-bar">
    <a href="#" class="back-link">
      <i class="fa-solid fa-arrow-left"></i>
      <span>Back to Card</span>
    </a>

    <button class="lang-btn" title="Translate / Language">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="m5 8 6 6"/>
        <path d="m4 14 6-6 2-3"/>
        <path d="M2 5h12"/>
        <path d="M7 2h1"/>
        <path d="m22 22-5-10-5 10"/>
        <path d="M14 18h6"/>
      </svg>
    </button>
  </header>

  <!-- Central Form Card -->
  <main class="login-center">
    <div class="login-card">
      <h1 class="login-title">Admin Login</h1>
      <p class="login-subtitle">Sign in to access the dashboard</p>

      <!-- Alert Error Message -->
      <div class="alert-box alert-error" *ngIf="errorMessage">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span>{{ errorMessage }}</span>
      </div>

      <!-- Alert Success Message -->
      <div class="alert-box alert-success" *ngIf="successMessage">
        <i class="fa-solid fa-circle-check"></i>
        <span>{{ successMessage }}</span>
      </div>

      <form (ngSubmit)="onSubmit()" class="login-form">
        <!-- Email Input -->
        <div class="input-field">
          <i class="fa-regular fa-envelope field-icon"></i>
          <input
            type="email"
            name="email"
            class="form-input"
            placeholder="admin@example.com"
            [(ngModel)]="email"
            required
            autocomplete="email"
          />
        </div>

        <!-- Password Input -->
        <div class="input-field">
          <i class="fa-solid fa-lock field-icon"></i>
          <input
            [type]="showPassword ? 'text' : 'password'"
            name="password"
            class="form-input"
            placeholder="••••••••"
            [(ngModel)]="password"
            required
            autocomplete="current-password"
          />
        </div>

        <!-- Submit Button -->
        <button type="submit" class="sign-in-btn" [disabled]="isLoading">
          <span *ngIf="!isLoading">Sign In</span>
          <span *ngIf="isLoading"><i class="fa-solid fa-spinner fa-spin"></i> Signing in...</span>
        </button>
      </form>
    </div>
  </main>
</div>
