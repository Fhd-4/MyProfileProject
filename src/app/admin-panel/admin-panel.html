<div class="admin-wrapper" dir="ltr">
  <canvas #particleCanvas class="interactive-canvas"></canvas>

  <div class="container">
    
    <header class="page-header">
      <div class="title">
        <div class="polygon-logo"></div>
        <h1>Admin Panel</h1>
      </div>
      <div class="actions">
        <button class="icon-btn" type="button"><i class="fa-solid fa-language"></i></button>
        <button class="icon-btn" type="button"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
      </div>
    </header>

    <!-- العدادات العلوية أصبحت تقرأ الأرقام الحقيقية المحدثة الآن تلقائياً -->
    <section class="stats">
      <div class="stat-card">
        <div class="icon-badge blue-badge"><i class="fa-solid fa-users"></i></div>
        <div>
          <h2>{{ totalClientsCount }}</h2>
          <p>Total Clients</p>
        </div>
      </div>
      <div class="stat-card">
        <div class="icon-badge green-badge"><i class="fa-solid fa-check"></i></div>
        <div>
          <h2>{{ activeClientsCount }}</h2>
          <p>Active</p>
        </div>
      </div>
      <div class="stat-card">
        <div class="icon-badge cyan-badge"><i class="fa-regular fa-clock"></i></div>
        <div>
          <h2>{{ expiredClientsCount }}</h2>
          <p>Expired</p>
        </div>
      </div>
    </section>

    <div class="action-trigger-row">
      <button class="add-btn" type="button" (click)="toggleForm($event)">
        <i class="fa-solid fa-user-plus"></i> Add New Client
      </button>
    </div>

    <section class="form-panel" *ngIf="isFormOpen">
      <h3>Create New Client</h3>
      <form (ngSubmit)="onSubmitClient($event)">
        <div class="form-row rows-2">
          <div class="input-group">
            <label>Client Name</label>
            <input type="text" name="name" [(ngModel)]="newClient.name" placeholder="Ahmed Ali" required />
          </div>
          <div class="input-group">
            <label>Email</label>
            <input type="email" name="email" [(ngModel)]="newClient.email" placeholder="client@example.com" required />
          </div>
        </div>

        <div class="form-row rows-3">
          <div class="input-group">
            <label>Password</label>
            <input type="password" name="password" [(ngModel)]="newClient.password" placeholder="••••••••" required />
          </div>
          <div class="input-group">
            <label>Duration</label>
            <input type="number" name="duration" [(ngModel)]="newClient.duration" />
          </div>
          <div class="input-group">
            <label>Unit</label>
            <select name="unit" [(ngModel)]="newClient.unit">
              <option value="Hours">Hours</option>
              <option value="Days">Days</option>
              <option value="Months">Months</option>
              <option value="Years">Years</option>
            </select>
          </div>
        </div>

        <div class="form-actions-buttons">
          <button type="submit" class="submit-btn">Create</button>
          <button type="button" class="cancel-btn" (click)="toggleForm($event)">Cancel</button>
        </div>
      </form>
    </section>

    <!-- حلقة التكرار تعرض الآن الحقول الديناميكية الفردية القادمة من GET users -->
    <section class="client-directory-list">
      <div class="client-card-row" *ngFor="let client of clients; let i = index">
        <div class="client-left-profile">
          <img [src]="client.avatar" alt="Avatar" />
          <div class="client-meta-info">
            <div class="title-status-line">
              <h4>{{ client.clientName }}</h4>
              <span class="status-badge" [ngClass]="client.status === 'Active' ? 'badge-active' : 'badge-expired'">
                {{ client.status }}
              </span>
            </div>
            <p class="email-row-text">Email: <span>{{ client.email }}</span> <i class="fa-regular fa-copy copy-action-btn"></i></p>
            <p class="expiration-row-text text-highlighted">
              <i class="fa-regular fa-clock"></i> Expires: {{ client.expires }}
            </p>
          </div>
        </div>
        <div class="client-right-actions">
          <button class="row-action-btn" type="button"><i class="fa-regular fa-eye"></i></button>
          <button class="row-action-btn" type="button"><i class="fa-regular fa-edit"></i></button>
          <button class="row-action-btn delete-btn-accent" type="button" (click)="deleteClient(i, $event)"><i class="fa-regular fa-trash-can"></i></button>
        </div>
      </div>
    </section>

  </div>
</div>
