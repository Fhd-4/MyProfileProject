<div class="admin-wrapper" dir="ltr">
  <!-- Top Bar -->
  <header class="admin-header">
    <div class="header-brand">
      <div class="brand-logo">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <span class="brand-title">Admin Dashboard</span>
    </div>

    <div class="user-profile-section">
      <div class="user-badge" *ngIf="user">
        <i class="fa-solid fa-user-gear"></i>
        <span>{{ user.username || user.email || 'Admin User' }}</span>
        <span class="role-pill">Admin</span>
      </div>

      <button class="logout-btn" (click)="logout()" title="Logout">
        <i class="fa-solid fa-right-from-bracket"></i>
        <span>Sign Out</span>
      </button>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="admin-content">
    <div class="dashboard-banner">
      <h1>Welcome to Admin Dashboard 👋</h1>
      <p>Manage system users, digital card profiles, and configuration settings.</p>
    </div>

    <!-- Stat Cards Grid -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon icon-blue">
          <i class="fa-solid fa-users"></i>
        </div>
        <div class="stat-info">
          <h3>Total Registered Users</h3>
          <span class="stat-number">124</span>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon icon-purple">
          <i class="fa-solid fa-id-card"></i>
        </div>
        <div class="stat-info">
          <h3>Active Card Profiles</h3>
          <span class="stat-number">98</span>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon icon-green">
          <i class="fa-solid fa-circle-check"></i>
        </div>
        <div class="stat-info">
          <h3>System Status</h3>
          <span class="stat-status">Operational</span>
        </div>
      </div>
    </div>
  </main>
</div>
